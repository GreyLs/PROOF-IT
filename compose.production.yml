name: fsp-production
x-restricted: &restricted
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  restart: unless-stopped
  logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}
services:
  gateway:
    <<: *restricted
    build: {context: ., dockerfile: deploy/Gateway.Dockerfile}
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: {PUBLIC_HOST: "${PUBLIC_HOST:?Set PUBLIC_HOST}"}
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "certificates:/data", "gateway_config:/config"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,uid=10004,gid=10004"]
    networks:
      front: {ipv4_address: "${GATEWAY_IP:-172.30.10.2}"}
      public: {}
    depends_on: {api: {condition: service_healthy}}
    mem_limit: 256m
  postgres:
    image: postgres:17-bookworm
    environment: {POSTGRES_USER: fsp_admin, POSTGRES_DB: fsp_trajectory, POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password}
    secrets: [db_admin_password, db_migrator_password, db_api_password, db_worker_password]
    volumes: ["database:/var/lib/postgresql/data", "./deploy/production-init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro"]
    networks: [database]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U fsp_admin -d fsp_trajectory"], interval: 5s, timeout: 3s, retries: 20}
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}
  migrate:
    <<: *restricted
    build: {context: ., target: api}
    restart: "no"
    command: [--prepare]
    environment: {DATABASE_URL_FILE: /run/secrets/database_migrator_url, FSP_ENV: production, FSP_DEMO_MODE: "false", BASE_URL: "${BASE_URL:?Set BASE_URL}"}
    secrets: [database_migrator_url]
    networks: [database]
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 512m
  grants:
    <<: *restricted
    image: postgres:17-bookworm
    restart: "no"
    user: "999:999"
    entrypoint: [/bin/sh, /config/grants.sh]
    secrets: [db_migrator_password]
    volumes: ["./deploy/production-grants.sh:/config/grants.sh:ro", "./deploy/production-grants.sql:/config/grants.sql:ro"]
    networks: [database]
    depends_on: {migrate: {condition: service_completed_successfully}}
    mem_limit: 128m
  api:
    <<: *restricted
    build: {context: ., target: api}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_api_url
      MAIL_ENCRYPTION_KEY_FILE: /run/secrets/mail_encryption_key
      INTEGRATION_ENCRYPTION_KEY_FILE: /run/secrets/integration_encryption_key
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_HOST: "${SMTP_HOST:?Set SMTP_HOST}"
      SMTP_FROM: "${SMTP_FROM:?Set SMTP_FROM}"
      SMTP_USER: "${SMTP_USER:?Set SMTP_USER}"
      FSP_ENV: production
      FSP_DEMO_MODE: "false"
      BASE_URL: "${BASE_URL:?Set BASE_URL}"
      TRUSTED_PROXY_IPS: "${GATEWAY_IP:-172.30.10.2}"
      OLLAMA_URL: "http://inference:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:8b}"
      FSP_REQUIRE_GPU: "${FSP_REQUIRE_GPU:-true}"
      FSP_GPU_MIN_OFFLOAD_PERCENT: "${FSP_GPU_MIN_OFFLOAD_PERCENT:-100}"
    secrets: [database_api_url, mail_encryption_key, integration_encryption_key, smtp_password]
    volumes: [documents:/app/runtime/storage]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001"]
    networks:
      front: {ipv4_address: "${API_IP:-172.30.10.3}"}
      database: {}
      mail_egress: {}
      inference_front: {}
    depends_on: {grants: {condition: service_completed_successfully}}
    mem_limit: 512m
    cpus: 2
    stop_grace_period: 60s
  worker:
    <<: *restricted
    build: {context: ., dockerfile: deploy/Controller.Dockerfile}
    environment: {WORKER_DATABASE_URL_FILE: /run/secrets/database_worker_url, PROCESSOR_TOKEN_FILE: /run/secrets/processor_token, PROCESSOR_URL: "http://processor:8081"}
    secrets: [database_worker_url, processor_token]
    volumes: [documents:/app/runtime/storage]
    networks: [database, processing]
    depends_on: {api: {condition: service_healthy}, processor: {condition: service_healthy}}
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 330s
  processor:
    <<: *restricted
    build: {context: ., dockerfile: deploy/Processor.Dockerfile}
    environment: {PROCESSOR_TOKEN_FILE: /run/secrets/processor_token, OLLAMA_URL: "http://inference:11434", OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:8b}", FSP_REQUIRE_GPU: "${FSP_REQUIRE_GPU:-true}", FSP_GPU_MIN_OFFLOAD_PERCENT: "${FSP_GPU_MIN_OFFLOAD_PERCENT:-100}"}
    secrets: [processor_token]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,uid=10002,gid=10002"]
    networks: [processing, inference_front]
    healthcheck: {test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=2)"], interval: 15s, timeout: 3s, retries: 5}
    mem_limit: 2560m
    cpus: 2
    stop_grace_period: 300s
  inference:
    <<: *restricted
    build: {context: ., dockerfile: deploy/Gateway.Dockerfile}
    command: [caddy, run, --config, /etc/caddy/Caddyfile]
    volumes: ["./deploy/Inference.Caddyfile:/etc/caddy/Caddyfile:ro"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=10004,gid=10004", "/config:rw,noexec,nosuid,size=8m,uid=10004,gid=10004"]
    networks: [inference_front, inference_back]
    mem_limit: 128m
  ollama:
    <<: *restricted
    build: {context: ., dockerfile: deploy/Model.Dockerfile}
    volumes: [models:/models]
    tmpfs: ["/tmp:rw,nosuid,size=256m,uid=10003,gid=10003"]
    networks: [inference_back]
    mem_limit: 12g
    cpus: 4
  model-pull:
    <<: *restricted
    build: {context: ., dockerfile: deploy/Model.Dockerfile}
    profiles: [bootstrap]
    restart: "no"
    entrypoint: [/bin/sh, /config/pull.sh]
    environment: {OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:8b}"}
    volumes: ["models:/models", "./deploy/model-pull.sh:/config/pull.sh:ro"]
    tmpfs: ["/tmp:rw,nosuid,size=256m,uid=10003,gid=10003"]
    networks: [model_download]
    mem_limit: 1g
networks:
  public: {}
  mail_egress: {}
  model_download: {}
  front: {internal: true, ipam: {config: [{subnet: "${FRONT_SUBNET:-172.30.10.0/24}"}]}}
  database: {internal: true}
  processing: {internal: true}
  inference_front: {internal: true}
  inference_back: {internal: true}
volumes:
  database: {}
  documents: {}
  models: {}
  certificates: {}
  gateway_config: {}
secrets:
  db_admin_password: {file: ./deploy/secrets/db_admin_password}
  db_migrator_password: {file: ./deploy/secrets/db_migrator_password}
  db_api_password: {file: ./deploy/secrets/db_api_password}
  db_worker_password: {file: ./deploy/secrets/db_worker_password}
  database_migrator_url: {file: ./deploy/secrets/database_migrator_url}
  database_api_url: {file: ./deploy/secrets/database_api_url}
  database_worker_url: {file: ./deploy/secrets/database_worker_url}
  processor_token: {file: ./deploy/secrets/processor_token}
  mail_encryption_key: {file: ./deploy/secrets/mail_encryption_key}
  integration_encryption_key: {file: ./deploy/secrets/integration_encryption_key}
  smtp_password: {file: ./deploy/secrets/smtp_password}
