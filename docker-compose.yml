name: fsp-trajectory
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: fsp_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: fsp_trajectory
      FSP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/01-app.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fsp_admin -d fsp_trajectory]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
  seed:
    build: {context: ., target: api}
    command: [--prepare]
    environment:
      DATABASE_URL: postgresql://fsp_app:${POSTGRES_APP_PASSWORD}@postgres:5432/fsp_trajectory
      FSP_DEMO_MODE: ${FSP_DEMO_MODE:-true}
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [documents:/app/runtime/storage]
  api:
    build: {context: ., target: api}
    environment:
      DATABASE_URL: postgresql://fsp_app:${POSTGRES_APP_PASSWORD}@postgres:5432/fsp_trajectory
      FSP_DEMO_MODE: ${FSP_DEMO_MODE:-true}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      FSP_REQUIRE_GPU: ${FSP_REQUIRE_GPU:-true}
      FSP_GPU_MIN_OFFLOAD_PERCENT: ${FSP_GPU_MIN_OFFLOAD_PERCENT:-100}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8080:8080"]
    volumes: [documents:/app/runtime/storage]
    depends_on:
      seed: {condition: service_completed_successfully}
    restart: unless-stopped
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
  worker:
    build: {context: ., dockerfile: worker/Dockerfile}
    environment:
      DATABASE_URL: postgresql://fsp_app:${POSTGRES_APP_PASSWORD}@postgres:5432/fsp_trajectory
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      FSP_REQUIRE_GPU: ${FSP_REQUIRE_GPU:-true}
      FSP_GPU_MIN_OFFLOAD_PERCENT: ${FSP_GPU_MIN_OFFLOAD_PERCENT:-100}
    volumes: [documents:/app/runtime/storage]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    security_opt: [no-new-privileges:true]
volumes:
  database:
  documents:
