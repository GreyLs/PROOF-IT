# Source: proofit-horizon/templates/gateway.yaml
apiVersion: apps/v1
kind: Deployment
metadata: {name: proofit-gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app: proofit-gateway}}
  template:
    metadata: {labels: {app: proofit-gateway, tier: edge}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: gateway
          image: "registry.example.org/proofit/api:1.0.0"
          env:
            - {name: FSP_SERVICE, value: gateway}
            - {name: BIND_ADDR, value: "0.0.0.0:8080"}
            - {name: FSP_IDENTITY_URL, value: "http://proofit-identity:8080"}
            - {name: FSP_TALENT_URL, value: "http://proofit-talent:8080"}
            - {name: FSP_RECRUITMENT_URL, value: "http://proofit-recruitment:8080"}
            - {name: FSP_DOCUMENTS_URL, value: "http://proofit-documents:8080"}
            - {name: FSP_INTEGRATIONS_URL, value: "http://proofit-integrations:8080"}
            - {name: FSP_PLATFORM_URL, value: "http://proofit-platform:8080"}
            - {name: FSP_INTELLIGENCE_URL, value: "http://proofit-intelligence:8080"}
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 250m, memory: 128Mi}, limits: {cpu: "2", memory: 512Mi}}
          readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
