# Source: proofit-horizon/templates/services.yaml
apiVersion: apps/v1
kind: Deployment
metadata: {name: proofit-intelligence-engine}
spec:
  replicas: 2
  selector: {matchLabels: {app: proofit-intelligence-engine}}
  template:
    metadata: {labels: {app: proofit-intelligence-engine, tier: compute}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10005}
      containers:
        - name: intelligence
          image: "registry.example.org/proofit/intelligence:1.0.0"
          env:
            - {name: INTELLIGENCE_TOKEN, valueFrom: {secretKeyRef: {name: proofit-runtime, key: INTELLIGENCE_TOKEN}}}
            - {name: REDIS_URL, value: "redis://proofit-redis:6379/0"}
            - {name: INTELLIGENCE_SLOTS, value: "2"}
            - {name: FSP_OIDC_ISSUER, valueFrom: {secretKeyRef: {name: proofit-runtime, key: FSP_OIDC_ISSUER, optional: true}}}
            - {name: FSP_OIDC_CLIENT_ID, valueFrom: {secretKeyRef: {name: proofit-runtime, key: FSP_OIDC_CLIENT_ID, optional: true}}}
            - {name: FSP_OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: proofit-runtime, key: FSP_OIDC_CLIENT_SECRET, optional: true}}}
          ports: [{containerPort: 8092}]
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
          readinessProbe: {httpGet: {path: /health, port: 8092}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8092}, periodSeconds: 20}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
# Source: proofit-horizon/templates/gateway.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: proofit-gateway}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: proofit-gateway}
  minReplicas: 2
  maxReplicas: 64
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
---
# Source: proofit-horizon/templates/services.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: proofit-identity}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: proofit-identity}
  minReplicas: 2
  maxReplicas: 64
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
