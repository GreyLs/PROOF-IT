            - {name: BIND_ADDR, value: "0.0.0.0:8080"}
            - {name: BASE_URL, value: "https://proofit.example.org"}
            - {name: FSP_ENV, value: "production"}
            - {name: FSP_DEMO_MODE, value: "false"}
            - {name: TRUSTED_PROXY_IPS, value: "10.42.0.0/16"}
            - {name: DATABASE_MAX_CONNECTIONS, value: "4"}
            - {name: INTELLIGENCE_URL, value: "http://proofit-intelligence-engine:8092"}
            - {name: FSP_FORECAST_URL, value: "http://proofit-forecast:8090"}
            - {name: WORKBENCH_URL, value: "http://proofit-workbench:8091"}
            - {name: OLLAMA_URL, value: "http://proofit-qwen:11434"}
            - {name: STORAGE_DIR, value: "/app/runtime/storage"}
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 250m, memory: 128Mi}, limits: {cpu: "2", memory: 512Mi}}
          readinessProbe: {httpGet: {path: /api/health, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/health/live, port: 8080}, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: documents, mountPath: /app/runtime/storage}]
      volumes: [{name: documents, persistentVolumeClaim: {claimName: proofit-documents-rwx}}]
