[databases]
proofit = host=proofit-postgresql port=5432 dbname=proofit
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /run/secrets/pgbouncer-users.txt
pool_mode = session
max_client_conn = 4096
default_pool_size = 64
reserve_pool_size = 16
max_db_connections = 128
server_reset_query = DISCARD ALL
server_reset_query_always = 1
query_timeout = 30
client_idle_timeout = 300
log_connections = 0
log_disconnections = 0
# Session mode preserves the current SQLx after_connect settings. Transaction
# pooling may be enabled only after transaction-local setup is implemented.
