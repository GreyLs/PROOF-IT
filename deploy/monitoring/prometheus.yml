global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: {platform: proofit, environment: local}
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: [alertmanager:9093]}]
scrape_configs:
  - job_name: proofit
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/exporter-token
    static_configs: [{targets: [host.docker.internal:9198]}]
  - job_name: prometheus
    static_configs: [{targets: [localhost:9090]}]
